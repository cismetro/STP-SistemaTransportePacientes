worker_processes 1;

error_log logs/error.log;

pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    server_names_hash_bucket_size 64;
    
    client_max_body_size 0;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    
    access_log logs/access.log main;
    
    sendfile on;
    keepalive_timeout 65;
    
    # ========================================
    # UPSTREAMS - Backends
    # ========================================
    
    # Backend ESUS (HTTPS interno na porta 1443)
    upstream esus_backend {
        server 127.0.0.1:1443;
        keepalive 32;
    }
    
    # Backend Transporte (HTTPS interno na porta 5020)
    upstream transporte_backend {
        server 127.0.0.1:5020  ;
        keepalive 32;
    }

    # Backend Central (HTTP interno na porta 8070)
    upstream central_backend {
        server 127.0.0.1:8070;
        keepalive 32;
    }
    
    # Backend Farmácia (HTTP interno na porta 9001)
    upstream farmacia_backend {
        server 127.0.0.1:9001;
        keepalive 32;
    }

    # Backend Satisfação FMS (HTTP interno na porta 9035)
    upstream satisfacao_backend {
    server 127.0.0.1:9035;
    keepalive 32;
    }
    
    # Backend Mapas (HTTP interno na porta 9010)
    upstream mapas_backend {
        server 127.0.0.1:9010;
        keepalive 32;
    }
    
    # Backend Drive (máquina remota)
    upstream drive_backend {
        server 192.168.92.252:9022;
        keepalive 32;
    }
    
    # Backend Indicador PEC 360 (HTTP local na porta 3005)
    upstream indicador_backend {
        server 127.0.0.1:3005;
        keepalive 32;
    }
    
    # Backend Painel de Chamada (HTTP interno na porta 8022)
    upstream painel_backend {
        server 127.0.0.1:8022;
        keepalive 32;
    }
    
    # ========================================
    # SERVIDOR HTTPS - esus.cosmopolis.sp.gov.br
    # ========================================
    server {
        listen 443 ssl;
        http2 on;
        server_name esus.cosmopolis.sp.gov.br;
        
        ssl_certificate "C:/certbot/live/esus.cosmopolis.sp.gov.br/fullchain.pem";
        ssl_certificate_key "C:/certbot/live/esus.cosmopolis.sp.gov.br/privkey.pem";
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        # ========================================
        # INDICADOR - PEC 360 Sistema de Consulta APS
        # ========================================
        
        location /indicador/ {
            proxy_pass http://indicador_backend/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Prefix /indicador;
            proxy_set_header X-Script-Name /indicador;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 75s;
            
            proxy_ignore_client_abort on;
            chunked_transfer_encoding on;
        }
        
        # ========================================
        # MAPAS - Aplicação de Mapeamento Geográfico
        # ========================================
        
        location /mapas {
            proxy_pass http://mapas_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Prefix /mapas;
            proxy_set_header X-Script-Name /mapas;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 75s;
            
            proxy_ignore_client_abort on;
            
            chunked_transfer_encoding on;
        }
        
        location ~ ^/mapas/(api|areas|points|layers|auth|login|logout|usuarios|area) {
            proxy_pass http://mapas_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /mapas;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_buffering off;
            proxy_cache off;
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        
        location /mapas/static/ {
            proxy_pass http://mapas_backend/static/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_cache_valid 200 1h;
            proxy_cache_bypass $http_pragma $http_authorization;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ========================================
        # FMS SATISFAÇÃO - Pesquisa de Satisfação
        # ========================================

        location /fms/static/ {
            proxy_pass http://satisfacao_backend/static/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /fms {
            proxy_pass http://satisfacao_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /fms;
            proxy_set_header X-Script-Name /fms;
        }

        
        # ========================================
        # FARMÁCIA - Aplicação de Gestão Farmacêutica
        # ========================================
        
        location /farmacia {
            proxy_pass http://farmacia_backend/farmacia;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Prefix /farmacia;
            proxy_set_header X-Script-Name /farmacia;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 75s;
            
            proxy_ignore_client_abort on;
            
            chunked_transfer_encoding on;
        }
        
        location ~ ^/farmacia/(inventory|patients|queue|stock|auth) {
            proxy_pass http://farmacia_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /farmacia;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_buffering off;
            proxy_cache off;
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        
        location /farmacia/static/ {
            proxy_pass http://farmacia_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_cache_valid 200 1h;
            proxy_cache_bypass $http_pragma $http_authorization;
            add_header X-Cache-Status $upstream_cache_status;
        }
        
        location /farmacia/socket.io/ {
            proxy_pass http://farmacia_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 75s;
            
            proxy_ignore_client_abort on;
            
            chunked_transfer_encoding on;
        }
        
        # ========================================
        # DRIVE - Aplicação na máquina remota
        # ========================================
        
        location /drive/ {
            proxy_pass http://drive_backend/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Prefix /drive;
            proxy_set_header X-Script-Name /drive;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 75s;
            
            proxy_ignore_client_abort on;
            chunked_transfer_encoding on;
        }
        
        # ========================================
        # ATMOSPHERE (ESUS) - WebSocket/Long-Polling para Videochamada
        # ========================================
        location /atmosphere/ {
            proxy_pass https://esus_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 75s;
            
            proxy_ignore_client_abort on;
            
            chunked_transfer_encoding on;
            
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;
        }
        
        # ========================================
        # CENTRAL - Aplicação de Regulação e WebSocket
        # ========================================
        location /central {
            proxy_pass http://central_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 75s;
        }
        
        # ========================================
        # PAINEL DE CHAMADA - Vídeos e Senhas
        # ========================================
        
        location /painelchamada/static/ {
            proxy_pass http://painel_backend/static/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /painelchamada;
            proxy_set_header X-Script-Name /painelchamada;
        }

        location /painelchamada {
            proxy_pass http://painel_backend/;
            proxy_redirect / /painelchamada/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /painelchamada;
            proxy_set_header X-Script-Name /painelchamada;
            
            proxy_buffering off;
            proxy_cache off;
        }
        
        location /painelchamada/socket.io/ {
            proxy_pass http://painel_backend/socket.io/;
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /painelchamada;
            proxy_set_header X-Script-Name /painelchamada;
            
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 75s;
        }
        
        # ========================================
        # TRANSPORTE - STP (Sistema Transporte de Pacientes)
        # ========================================
        location = /transporte {
            return 301 /transporte/;
        }

        location /transporte/ {
            proxy_pass http://transporte_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Prefix /transporte;
            proxy_set_header X-Script-Name /transporte;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 75s;

            proxy_ignore_client_abort on;
            chunked_transfer_encoding on;
        }

        location /transporte/static/ {
            proxy_pass http://transporte_backend/static/;
            proxy_set_header X-Forwarded-Prefix /transporte;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache_valid 200 1h;
            proxy_cache_bypass $http_pragma $http_authorization;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ========================================
        # ESUS - Aplicação Principal (DEVE SER O ÚLTIMO!)
        # ========================================
        location / {
            proxy_pass https://esus_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;
            
            proxy_buffering off;
        }
    }
    
    # ========================================
    # Redirect HTTP para HTTPS
    # ========================================
    server {
        listen 80;
        server_name esus.cosmopolis.sp.gov.br;
        return 301 https://$host$request_uri;
    }
    
    # ========================================
    # Mapeamento de upgrade para WebSocket
    # ========================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
}
